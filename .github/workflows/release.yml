on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:
    # Support re-running the workflow manually from the Actions tab in case it
    # fails and we need to fix something in the automation but still have it
    # run against the existing tag.
    inputs:
      tag:
        description: 'release tag version'
        required: true

name: Create a release

jobs:
  build:
    name: Create Release
    environment: release
    if: github.repository == 'cilium/hubble'
    runs-on: ubuntu-24.04
    permissions:
      contents: 'write'
    steps:
      - name: Set tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Generate artifacts
        run: make release
      - name: Create draft release and upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Note for maintainers: Please update the description with the
            actual release notes (see RELEASE.md for instructions).
          files: |
            release/*
